name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["dev", "dev,data"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Type check (advisory)
        continue-on-error: true
        run: python -m mypy src
      - name: Tests
        run: python -m pytest -q --cov=rl_quant --cov-report=term-missing
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  adaptive-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,data]"
      - name: Adaptive alpha and compiler qualification
        run: >-
          python -m pytest -q
          tests/test_massive_adaptive_alpha_protocol.py
          tests/test_adaptive_alpha_no_hold_dependency.py
          tests/test_adaptive_alpha_term_structure_v1.py
          tests/test_massive_adaptive_alpha_targets_v1.py
          tests/test_massive_adaptive_origin_authority_v1.py
          tests/test_massive_adaptive_source_targets_v1.py
          tests/test_massive_adaptive_decision_tensor_v1.py
          tests/test_massive_adaptive_source_authorized_training_v1.py
          tests/test_massive_adaptive_forecast_archive_v1.py
          tests/test_massive_adaptive_forecast_archive_v2.py
          tests/test_adaptive_alpha_supervised_v1.py
          tests/test_massive_adaptive_portfolio_compiler_v1.py
          tests/test_massive_economic_authority_v6.py
          tests/test_massive_adaptive_profitability_v1_vertical_slice.py
          tests/test_massive_adaptive_outer_evidence_v1.py
          tests/test_adaptive_alpha_profit_checkpoint_selection_v1.py
          tests/test_no_feature_engineering.py
