[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-quant"
version = "0.1.0"
description = "Compact reinforcement-learning trading framework for intraday, daily strategy, and hourly market-context experiments"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2,<3",
    # Floor is 2.6 so the package metadata stays consistent with the default
    # CUDA 12.4 environment provisioned by scripts/setup_quanttrade_miniforge_env.sh
    # (torch==2.6.0+cu124, pinned there for vLLM compatibility). The code only
    # uses stable torch APIs (<=2.3 era), and 2.8/2.11 CUDA profiles remain valid.
    "torch>=2.6,<3",
]

[project.scripts]
qt = "rl_quant.cli:main"
quanttrade = "rl_quant.cli:main"
quanttrade-top2000-ppo = "rl_quant.workflows.top2000_ppo:main"
quanttrade-top2000-pipeline = "rl_quant.workflows.top2000_pipeline:main"
quanttrade-top2000-m03r-v7-dev = "rl_quant.workflows.top2000_m03r_v7_dev:main"
quanttrade-hold30-prelockbox = "rl_quant.workflows.hold30_prelockbox:main"
quanttrade-hold30-alpha-prelockbox = "rl_quant.workflows.hold30_alpha_prelockbox:main"
quanttrade-adaptive-rl = "rl_quant.workflows.massive_adaptive_rl_v2:main"

[project.optional-dependencies]
data = [
    "pandas>=2.2,<3",
    "pyarrow>=16,<23",
]
llm = [
    "transformers>=4.43,<5",
    "huggingface-hub>=0.24,<2",
    "accelerate>=0.33,<2",
    "sentencepiece>=0.2,<1",
    "safetensors>=0.4,<1",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    # The default CI command collects the complete repository test suite.
    # A large part of that suite imports the persisted-data authorities at
    # collection time, so a developer test environment must be able to open
    # Arrow-backed artifacts even when the narrower `data` extra was not
    # requested explicitly.
    "pandas>=2.2,<3",
    "pyarrow>=16,<23",
    # Keep CI and developer lint semantics identical. Ruff 0.16 changed the
    # effective default rule surface and turned a routine dependency refresh
    # into hundreds of unrelated failures.
    "ruff==0.15.17",
    "mypy>=1.11,<2",
    "types-requests",
    "pandas-stubs",
]

[tool.ruff.lint]
# Spell out Ruff's historical default instead of allowing a future release to
# redefine the repository-wide lint contract.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
